<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FreeCAD v brskalniku</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #eef0f3;
               font-family: system-ui, "Segoe UI", sans-serif; color: #222; }
  canvas { display: block; }
  #hud { position: fixed; left: 12px; top: 12px; background: rgba(255,255,255,.92);
         padding: 8px 12px; border-radius: 6px; font-size: 13px; line-height: 1.55;
         box-shadow: 0 1px 4px rgba(0,0,0,.15); min-width: 220px; }
  #hud b { font-weight: 600; }
  #namig { position: fixed; left: 12px; bottom: 12px; font-size: 12px; color: #555;
           background: rgba(255,255,255,.7); padding: 4px 8px; border-radius: 4px; }
  #napaka { position: fixed; right: 12px; top: 12px; max-width: 40vw; background: #fff3f3;
            color: #900; padding: 8px 12px; border-radius: 6px; font-size: 12px; display: none;
            white-space: pre-wrap; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.webgpu.js",
  "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.webgpu.js",
  "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.tsl.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
} }
</script>
</head>
<body>
<div id="hud">Povezujem s FreeCAD-om …</div>
<div id="namig">Levi gumb: vrtenje · kolešček: povečava · desni gumb: premik · klik: izbira ploskve ali roba (Ctrl doda) · F: prilagodi pogled</div>
<div id="napaka"></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const ZETON = '__ZETON__';
const hud = document.getElementById('hud');
const napakaEl = document.getElementById('napaka');
const BARVA_ROBA = new THREE.Color(0x202428);
const BARVA_IZBIRE = new THREE.Color(0x1e88e5);
const BARVA_IZBIRE_ROBA = new THREE.Color(0x0d47a1);

function pokaziNapako(besedilo) {
  napakaEl.style.display = 'block';
  napakaEl.textContent = String(besedilo);
}

// --- prizor -----------------------------------------------------------------
const renderer = new THREE.WebGPURenderer({ antialias: true });
await renderer.init();
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(Math.max(1, window.innerWidth), Math.max(1, window.innerHeight));
document.body.appendChild(renderer.domElement);
const izris = renderer.backend && renderer.backend.isWebGPUBackend ? 'WebGPU' : 'WebGL 2';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xeef0f3);
const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 10000);
camera.up.set(0, 0, 1);           // CAD: os Z navzgor
camera.position.set(120, -140, 100);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.12;

scene.add(new THREE.HemisphereLight(0xffffff, 0x8a9099, 0.9));
const luc = new THREE.DirectionalLight(0xffffff, 1.6);
luc.position.set(1, -1.2, 2.2);
scene.add(luc);
const luc2 = new THREE.DirectionalLight(0xffffff, 0.5);
luc2.position.set(-1.5, 1, 0.6);
scene.add(luc2);

const mreza = new THREE.GridHelper(200, 20, 0xb0b6be, 0xd6dae0);
mreza.rotation.x = Math.PI / 2;  // v ravnino XY
scene.add(mreza);
scene.add(new THREE.AxesHelper(20));

const materialPloskev = new THREE.MeshStandardMaterial({ vertexColors: true, metalness: 0.05, roughness: 0.55, side: THREE.DoubleSide });
const materialRobov = new THREE.LineBasicMaterial({ vertexColors: true });

let koren = new THREE.Group();
scene.add(koren);
let objekti = new Map();      // ime -> { mesh, crte, podatki }
let prviNalozen = false;
let stanje = { dokument: '', verzija: 0, izbira: [] };

// --- gradnja geometrije -----------------------------------------------------
function zgradiObjekt(o) {
  const skupina = new THREE.Group();
  skupina.name = o.ime;

  let mesh = null;
  if (o.trikotniki.length) {
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(o.tocke, 3));
    geo.setIndex(o.trikotniki);
    const barve = new Float32Array(o.tocke.length);
    for (const p of o.ploskve) {
      for (let v = p[0]; v < p[0] + p[1]; v++) { barve[3 * v] = p[4]; barve[3 * v + 1] = p[5]; barve[3 * v + 2] = p[6]; }
    }
    geo.setAttribute('color', new THREE.BufferAttribute(barve, 3));
    geo.computeVertexNormals();
    mesh = new THREE.Mesh(geo, materialPloskev);
    mesh.userData = { objekt: o.ime, ploskve: o.ploskve, osnovneBarve: barve.slice() };
    skupina.add(mesh);
  }

  let crte = null;
  if (o.robTocke.length) {
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(o.robTocke, 3));
    const barve = new Float32Array(o.robTocke.length);
    for (let i = 0; i < barve.length; i += 3) { barve[i] = BARVA_ROBA.r; barve[i + 1] = BARVA_ROBA.g; barve[i + 2] = BARVA_ROBA.b; }
    geo.setAttribute('color', new THREE.BufferAttribute(barve, 3));
    crte = new THREE.LineSegments(geo, materialRobov);
    crte.userData = { objekt: o.ime, robovi: o.robovi };
    skupina.add(crte);
  }
  return { skupina, mesh, crte, podatki: o };
}

function pocisti() {
  koren.traverse(n => { if (n.geometry) n.geometry.dispose(); });
  scene.remove(koren);
  koren = new THREE.Group();
  scene.add(koren);
  objekti = new Map();
}

async function naloziModel() {
  const odziv = await fetch('/model', { cache: 'no-store' });
  const model = await odziv.json();
  pocisti();
  for (const o of model.objekti) {
    const z = zgradiObjekt(o);
    koren.add(z.skupina);
    objekti.set(o.ime, z);
  }
  stanje.dokument = model.dokument;
  stanje.verzija = model.verzija;
  if (!prviNalozen && model.objekti.length) { prilagodiPogled(); prviNalozen = true; }
  oznaciIzbiro(stanje.izbira);
  osveziHud();
}

function prilagodiPogled() {
  const okvir = new THREE.Box3().setFromObject(koren);
  if (okvir.isEmpty()) return;
  const sredisce = okvir.getCenter(new THREE.Vector3());
  const polmer = okvir.getSize(new THREE.Vector3()).length() / 2 || 10;
  const smer = new THREE.Vector3(1, -1.2, 0.9).normalize();
  const razdalja = polmer / Math.sin(THREE.MathUtils.degToRad(camera.fov / 2)) * 1.1;
  camera.position.copy(sredisce).addScaledVector(smer, razdalja);
  camera.near = razdalja / 100; camera.far = razdalja * 100; camera.updateProjectionMatrix();
  controls.target.copy(sredisce);
  controls.update();
  const velikostMreze = Math.ceil(polmer * 4 / 10) * 10;
  mreza.scale.setScalar(velikostMreze / 200);
  mreza.position.set(sredisce.x, sredisce.y, okvir.min.z);
}

// --- izbira -----------------------------------------------------------------
function ploskevTrikotnika(mesh, indeksTrikotnika) {
  const p = mesh.userData.ploskve;
  for (let i = 0; i < p.length; i++) { if (indeksTrikotnika >= p[i][2] && indeksTrikotnika < p[i][2] + p[i][3]) return i; }
  return -1;
}
function robOdseka(crte, indeksOdseka) {
  const r = crte.userData.robovi;
  for (let j = 0; j < r.length; j++) { if (indeksOdseka >= r[j][0] && indeksOdseka < r[j][0] + r[j][1]) return j; }
  return -1;
}

function oznaciIzbiro(izbira) {
  stanje.izbira = izbira || [];
  for (const z of objekti.values()) {
    if (z.mesh) { z.mesh.geometry.attributes.color.array.set(z.mesh.userData.osnovneBarve); z.mesh.geometry.attributes.color.needsUpdate = true; }
    if (z.crte) {
      const a = z.crte.geometry.attributes.color.array;
      for (let i = 0; i < a.length; i += 3) { a[i] = BARVA_ROBA.r; a[i + 1] = BARVA_ROBA.g; a[i + 2] = BARVA_ROBA.b; }
      z.crte.geometry.attributes.color.needsUpdate = true;
    }
  }
  for (const s of stanje.izbira) {
    const z = objekti.get(s.objekt);
    if (!z) continue;
    const elementi = s.elementi && s.elementi.length ? s.elementi : [''];
    for (const el of elementi) {
      if (el.startsWith('Face') && z.mesh) {
        const p = z.mesh.userData.ploskve[parseInt(el.slice(4), 10) - 1];
        if (p) pobarvajTocke(z.mesh, p[0], p[1], BARVA_IZBIRE);
      } else if (el.startsWith('Edge') && z.crte) {
        const r = z.crte.userData.robovi[parseInt(el.slice(4), 10) - 1];
        if (r) pobarvajTocke(z.crte, r[0] * 2, r[1] * 2, BARVA_IZBIRE_ROBA);
      } else if (el === '' && z.mesh) {
        pobarvajTocke(z.mesh, 0, z.mesh.geometry.attributes.position.count, BARVA_IZBIRE);
      }
    }
  }
  osveziHud();
}
function pobarvajTocke(predmet, zacetek, stevilo, barva) {
  const a = predmet.geometry.attributes.color.array;
  for (let v = zacetek; v < zacetek + stevilo; v++) { a[3 * v] = barva.r; a[3 * v + 1] = barva.g; a[3 * v + 2] = barva.b; }
  predmet.geometry.attributes.color.needsUpdate = true;
}

async function posljiIzbiro(objekt, element, dodaj) {
  await fetch('/select', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Zeton': ZETON },
    body: JSON.stringify({ objekt, element, dodaj }) });
}

const raycaster = new THREE.Raycaster();
const kazalec = new THREE.Vector2();
let pritisk = null;
renderer.domElement.addEventListener('pointerdown', e => { pritisk = { x: e.clientX, y: e.clientY, gumb: e.button }; });
renderer.domElement.addEventListener('pointerup', e => {
  if (!pritisk || pritisk.gumb !== 0) return;
  const premik = Math.hypot(e.clientX - pritisk.x, e.clientY - pritisk.y);
  pritisk = null;
  if (premik > 4) return;
  kazalec.set((e.clientX / window.innerWidth) * 2 - 1, -(e.clientY / window.innerHeight) * 2 + 1);
  raycaster.setFromCamera(kazalec, camera);
  raycaster.params.Line.threshold = controls.getDistance() * 0.004;
  const meshi = [], crte = [];
  for (const z of objekti.values()) { if (z.mesh) meshi.push(z.mesh); if (z.crte) crte.push(z.crte); }
  const zadetkiRobov = raycaster.intersectObjects(crte, false);
  const zadetkiPloskev = raycaster.intersectObjects(meshi, false);
  let objekt = null, element = '';
  if (zadetkiRobov.length && (!zadetkiPloskev.length || zadetkiRobov[0].distance <= zadetkiPloskev[0].distance + raycaster.params.Line.threshold * 2)) {
    const z = zadetkiRobov[0];
    objekt = z.object.userData.objekt;
    element = 'Edge' + (robOdseka(z.object, Math.floor(z.index / 2)) + 1);
  } else if (zadetkiPloskev.length) {
    const z = zadetkiPloskev[0];
    objekt = z.object.userData.objekt;
    element = 'Face' + (ploskevTrikotnika(z.object, z.faceIndex) + 1);
  }
  if (objekt) posljiIzbiro(objekt, element, e.ctrlKey);
  else if (!e.ctrlKey) posljiIzbiro('', '', false);
});
window.addEventListener('keydown', e => { if (e.key === 'f' || e.key === 'F') prilagodiPogled(); });

// --- HUD in dogodki ---------------------------------------------------------
function osveziHud() {
  const izbrano = stanje.izbira.length
    ? stanje.izbira.map(s => { const z = objekti.get(s.objekt); const ime = z ? z.podatki.oznaka : s.objekt; return s.elementi.length ? s.elementi.map(el => ime + '.' + el).join(', ') : ime; }).join('; ')
    : 'nič';
  hud.innerHTML = '<b>FreeCAD v brskalniku</b> · dokaz koncepta<br>'
    + 'Dokument: <b>' + (stanje.dokument || '–') + '</b> · objektov: ' + objekti.size + ' · posnetek ' + stanje.verzija + '<br>'
    + 'Izbira: <b>' + izbrano + '</b><br>'
    + 'Izris: ' + izris + ' · three.js ' + THREE.REVISION;
}

const dogodki = new EventSource('/events');
dogodki.addEventListener('model', () => { naloziModel().catch(pokaziNapako); });
dogodki.addEventListener('izbira', e => { oznaciIzbiro(JSON.parse(e.data)); });
dogodki.onerror = () => { hud.innerHTML = '<b>Povezava s FreeCAD-om je prekinjena.</b> Zaženi strežnik in osveži stran.'; };

window.addEventListener('resize', () => {
  if (window.innerWidth < 1 || window.innerHeight < 1) return;  // skrit zavihek: platno velikosti 0
  camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
renderer.setAnimationLoop(() => {
  controls.update();
  if (renderer.domElement.clientWidth > 0 && renderer.domElement.clientHeight > 0) renderer.render(scene, camera);
});
naloziModel().catch(pokaziNapako);
</script>
</body>
</html>
