<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FreeCAD v brskalniku</title>
<style>
  :root { --ozadje: #eef0f3; --plosca: #f7f8fa; --crta: #d3d7dd; --poudarek: #1e88e5; --besedilo: #222; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--ozadje);
               font-family: system-ui, "Segoe UI", sans-serif; color: var(--besedilo); font-size: 13px; }
  body { display: flex; flex-direction: column; }
  button { font: inherit; color: inherit; }

  /* Glava: hitri dostop, zavihki, podatki */
  #glava { background: var(--plosca); border-bottom: 1px solid var(--crta); flex: none; user-select: none; }
  #vrstica1 { display: flex; align-items: flex-end; gap: 12px; padding: 4px 8px 0 8px; }
  #hitri { display: flex; gap: 2px; padding-bottom: 4px; }
  #hitri .gumb { padding: 3px; }
  #hitri img { width: 20px; height: 20px; }
  #zavihki { display: flex; gap: 2px; }
  .zavihek { border: 1px solid transparent; border-bottom: none; border-radius: 6px 6px 0 0; padding: 5px 14px;
             background: transparent; cursor: pointer; }
  .zavihek:hover { background: #e6eaf0; }
  .zavihek.aktiven { background: #fff; border-color: var(--crta); border-top: 2px solid var(--poudarek); font-weight: 600; }
  .zavihek.urejanje { color: var(--poudarek); }
  #hud { margin-left: auto; font-size: 12px; line-height: 1.4; text-align: right; color: #444; padding-bottom: 4px; }
  #hud b { font-weight: 600; color: var(--besedilo); }

  /* Trak z ukazi */
  #trak { display: flex; align-items: stretch; gap: 0; padding: 4px 6px; background: #fff; overflow-x: auto; min-height: 84px; }
  .orodna { display: flex; align-items: stretch; }
  .skupina { display: grid; grid-auto-flow: column; grid-template-rows: repeat(3, 1fr); grid-auto-columns: max-content;
             column-gap: 1px; padding: 0 5px; border-right: 1px solid var(--crta); align-items: center; }
  .skupina:last-child { border-right: none; }
  .orodna:last-child .skupina:last-child { border-right: none; }
  .gumb { display: flex; align-items: center; gap: 5px; border: 1px solid transparent; border-radius: 4px; background: transparent;
          padding: 2px 6px; cursor: pointer; text-align: left; white-space: nowrap; line-height: 1.15; position: relative; }
  .gumb:hover:not([disabled]) { background: #e3e9f2; border-color: #c5cfdc; }
  .gumb:active:not([disabled]) { background: #cfdbea; }
  .gumb[disabled] { opacity: .38; cursor: default; }
  .gumb img { width: 16px; height: 16px; flex: none; }
  .gumb.velik { grid-row: span 3; flex-direction: column; justify-content: flex-start; gap: 3px; width: 74px; padding: 4px 3px 3px;
                white-space: normal; text-align: center; font-size: 11px; height: 100%; box-sizing: border-box; }
  .gumb.velik img { width: 32px; height: 32px; }
  .gumb.velik .napis { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; max-height: 2.4em; }
  .gumb.ikona .napis { display: none; }
  .gumb.ikona img { width: 20px; height: 20px; }
  .gumb.ikona { padding: 2px 3px; }
  .gumb .puscica { font-size: 9px; color: #666; margin-left: 2px; }
  .gumb.velik .puscica { margin: 0; }
  .gumb .puscica:hover { color: var(--poudarek); }

  /* Pogled */
  #pogled { flex: 1 1 auto; position: relative; min-height: 120px; }
  #pogled canvas { display: block; }
  #pasica { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); z-index: 5; max-width: 80%;
            background: #fff8e1; border: 1px solid #e0c36a; border-radius: 6px; padding: 6px 10px; font-size: 13px;
            display: flex; gap: 12px; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,.15); }
  #pasica button { border: 1px solid #c9b25a; background: #fff; border-radius: 4px; padding: 3px 9px; cursor: pointer; white-space: nowrap; }
  #pasica button:hover { background: #fdf3cf; }
  #namig { position: absolute; left: 12px; bottom: 12px; font-size: 12px; color: #555;
           background: rgba(255,255,255,.7); padding: 4px 8px; border-radius: 4px; pointer-events: none; }

  /* Namig ukaza in spustni meni */
  #opis { position: fixed; z-index: 20; max-width: 360px; background: #fffef5; border: 1px solid #c9c39a; border-radius: 4px;
          padding: 6px 9px; font-size: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.18); pointer-events: none; }
  #opis p { margin: 0 0 4px; } #opis p:last-child { margin: 0; }
  #meni { position: fixed; z-index: 30; background: #fff; border: 1px solid var(--crta); border-radius: 4px; padding: 4px;
          box-shadow: 0 4px 14px rgba(0,0,0,.18); display: flex; flex-direction: column; min-width: 180px; }
  #meni .gumb { padding: 4px 8px; }
  .skrit { display: none !important; }
  #napaka { position: fixed; right: 12px; bottom: 12px; max-width: 40vw; background: #fff3f3; color: #900; padding: 8px 12px;
            border-radius: 6px; font-size: 12px; display: none; white-space: pre-wrap; z-index: 40; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.webgpu.js",
  "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.webgpu.js",
  "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.tsl.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
} }
</script>
</head>
<body>
<div id="glava">
  <div id="vrstica1">
    <div id="hitri"></div>
    <div id="zavihki"></div>
    <div id="hud">Povezujem s FreeCAD-om …</div>
  </div>
  <div id="trak"></div>
</div>
<div id="pogled">
  <div id="pasica" class="skrit"><span id="pasicaBesedilo"></span><button id="pasicaGumb" type="button">Pokaži FreeCAD</button></div>
  <div id="namig">Levi gumb: vrtenje · kolešček: povečava · desni gumb: premik · klik: izbira ploskve ali roba (Ctrl doda) · F: prilagodi pogled</div>
</div>
<div id="opis" class="skrit"></div>
<div id="meni" class="skrit"></div>
<div id="napaka"></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const ZETON = '__ZETON__';
const $ = id => document.getElementById(id);
const hud = $('hud'), trak = $('trak'), zavihki = $('zavihki'), hitri = $('hitri'), opis = $('opis'), meni = $('meni');
const BARVA_ROBA = new THREE.Color(0x202428);
const BARVA_IZBIRE = new THREE.Color(0x1e88e5);
const BARVA_IZBIRE_ROBA = new THREE.Color(0x0d47a1);
const VELIKIH_NA_SKUPINO = 2;   // kot v SolidWorksu: prvi ukazi skupine veliki, ostali majhni v stolpcih po tri

function pokaziNapako(besedilo) { const n = $('napaka'); n.style.display = 'block'; n.textContent = String(besedilo); }
async function objavi(pot, telo) {
  const r = await fetch(pot, { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Zeton': ZETON }, body: JSON.stringify(telo) });
  if (!r.ok) throw new Error(pot + ': ' + r.status);
}

// --- stanje ---------------------------------------------------------------
const stanje = { dokument: '', verzija: 0, izbira: [], ukazi: null, aktivni: {}, okolje: { delovnaMiza: '', urejanje: '' }, zavihek: '' };
const gumbiPoImenu = new Map();   // ime ukaza -> [gumbi]

// --- trak z ukazi -----------------------------------------------------------
function ustvariGumb(u, velik, podukaz) {
  const g = document.createElement('button');
  g.className = 'gumb' + (velik ? ' velik' : '');
  g.dataset.ime = u.ime;
  const img = document.createElement('img');
  if (u.ikona) img.src = u.ikona; else img.style.visibility = 'hidden';
  img.alt = '';
  g.appendChild(img);
  const napis = document.createElement('span');
  napis.className = 'napis';
  napis.textContent = u.naslov;
  g.appendChild(napis);
  const indeks = podukaz != null ? podukaz : 0;
  if (u.podukazi && u.podukazi.length && podukaz == null) {
    const p = document.createElement('span');
    p.className = 'puscica';
    p.textContent = '▼';
    p.title = 'Več ukazov';
    p.addEventListener('click', e => { e.stopPropagation(); odpriMeni(g, u); });
    g.appendChild(p);
  }
  g.addEventListener('click', () => { if (!g.disabled) izvedi(u.ime, indeks); });
  g.addEventListener('mouseenter', () => pokaziOpis(g, u.namig || u.naslov));
  g.addEventListener('mouseleave', skrijOpis);
  if (!gumbiPoImenu.has(u.ime)) gumbiPoImenu.set(u.ime, []);
  gumbiPoImenu.get(u.ime).push(g);
  posodobiGumb(g, u.ime);
  return g;
}

function posodobiGumb(g, ime) {
  const a = stanje.aktivni[ime];
  g.disabled = a === false;
}

function odpriMeni(gumb, u) {
  meni.innerHTML = '';
  for (const p of u.podukazi) {
    const g = document.createElement('button');
    g.className = 'gumb';
    const img = document.createElement('img'); img.alt = ''; if (p.ikona) img.src = p.ikona; g.appendChild(img);
    const s = document.createElement('span'); s.textContent = p.naslov; g.appendChild(s);
    g.addEventListener('click', () => { zapriMeni(); izvedi(u.ime, p.indeks); });
    g.addEventListener('mouseenter', () => pokaziOpis(g, p.namig || p.naslov));
    g.addEventListener('mouseleave', skrijOpis);
    g.disabled = stanje.aktivni[u.ime] === false;
    meni.appendChild(g);
  }
  const r = gumb.getBoundingClientRect();
  meni.style.left = Math.min(r.left, window.innerWidth - 220) + 'px';
  meni.style.top = (r.bottom + 2) + 'px';
  meni.classList.remove('skrit');
}
function zapriMeni() { meni.classList.add('skrit'); }
document.addEventListener('pointerdown', e => { if (!meni.contains(e.target) && !e.target.classList.contains('puscica')) zapriMeni(); });

let opisCasovnik = null;
function pokaziOpis(gumb, html) {
  clearTimeout(opisCasovnik);
  opisCasovnik = setTimeout(() => {
    opis.innerHTML = html;
    const r = gumb.getBoundingClientRect();
    opis.classList.remove('skrit');
    const sirina = opis.offsetWidth;
    opis.style.left = Math.max(4, Math.min(r.left, window.innerWidth - sirina - 8)) + 'px';
    opis.style.top = (r.bottom + 6) + 'px';
  }, 350);
}
function skrijOpis() { clearTimeout(opisCasovnik); opis.classList.add('skrit'); }

async function izvedi(ime, indeks) {
  skrijOpis();
  try { await objavi('/ukaz', { ime, indeks }); } catch (e) { pokaziNapako(e); }
}

function narisiZavihke() {
  zavihki.innerHTML = '';
  for (const o of stanje.ukazi.delovnaOkolja) {
    const z = document.createElement('button');
    z.className = 'zavihek';
    z.dataset.ime = o.ime;
    z.textContent = o.naslov;
    z.addEventListener('click', () => izberiZavihek(o.ime, true));
    zavihki.appendChild(z);
  }
  hitri.innerHTML = '';
  for (const u of stanje.ukazi.hitriDostop) {
    const g = ustvariGumb(u, false, null);
    g.querySelector('.napis').remove();
    hitri.appendChild(g);
  }
}

function narisiTrak(imeOkolja, zgosceno) {
  skrijOpis();
  zapriMeni();
  trak.innerHTML = '';
  for (const [ime, gumbi] of gumbiPoImenu) { gumbiPoImenu.set(ime, gumbi.filter(g => hitri.contains(g))); }
  const o = stanje.ukazi.delovnaOkolja.find(x => x.ime === imeOkolja);
  if (!o) return;
  const velikih = zgosceno ? 1 : VELIKIH_NA_SKUPINO;
  for (const orodna of o.orodneVrstice) {
    const el = document.createElement('div');
    el.className = 'orodna';
    el.title = orodna.naslov;
    for (const skupina of orodna.skupine) {
      const s = document.createElement('div');
      s.className = 'skupina';
      skupina.forEach((u, i) => {
        const g = ustvariGumb(u, i < velikih, null);
        if (zgosceno && i >= velikih) g.classList.add('ikona');
        s.appendChild(g);
      });
      el.appendChild(s);
    }
    trak.appendChild(el);
  }
  // Kot v SolidWorksu: če je trak širši od okna, ostane velik le prvi gumb skupine, ostali so samo ikone.
  if (!zgosceno) requestAnimationFrame(() => { if (trak.scrollWidth > trak.clientWidth + 2) narisiTrak(imeOkolja, true); });
}
let casovnikVelikosti = null;
window.addEventListener('resize', () => {
  clearTimeout(casovnikVelikosti);
  casovnikVelikosti = setTimeout(() => { if (stanje.zavihek) narisiTrak(stanje.zavihek, false); }, 150);
});

function izberiZavihek(ime, izFreeCADa) {
  stanje.zavihek = ime;
  for (const z of zavihki.children) z.classList.toggle('aktiven', z.dataset.ime === ime);
  narisiTrak(ime);
  if (izFreeCADa) objavi('/okolje', { ime }).catch(pokaziNapako);
}

function uporabiOkolje(okolje) {
  stanje.okolje = okolje;
  // Med urejanjem skice pokažemo zavihek Skica, sicer aktivno delovno okolje FreeCAD-a.
  const urejaSkico = (okolje.urejanje || '').startsWith('Sketcher::');
  const cilj = urejaSkico ? 'SketcherWorkbench' : okolje.delovnaMiza;
  for (const z of zavihki.children) z.classList.toggle('urejanje', urejaSkico && z.dataset.ime === 'SketcherWorkbench');
  if (stanje.ukazi && cilj && stanje.ukazi.delovnaOkolja.some(o => o.ime === cilj) && cilj !== stanje.zavihek) izberiZavihek(cilj, false);
  // Pasica: FreeCAD čaka na odgovor v svojem oknu (modalno okno) ali ima odprto opravilo (nastavitve ukaza, urejanje skice).
  const pasica = $('pasica'), besedilo = $('pasicaBesedilo');
  if (okolje.pogovor) {
    besedilo.textContent = 'FreeCAD čaka na vaš odgovor v svojem oknu: »' + okolje.pogovor + '«';
    pasica.classList.remove('skrit');
  } else if (urejaSkico) {
    besedilo.textContent = 'Skica se ureja v oknu FreeCAD-a (urejevalnik skic v brskalniku še ni narejen).';
    pasica.classList.remove('skrit');
  } else if (okolje.opravilo) {
    const kaj = okolje.urejanje ? ' (' + okolje.urejanje.split('::').pop() + ')' : '';
    besedilo.textContent = 'V oknu FreeCAD-a je odprto opravilo' + kaj + ': tam vnesite nastavitve in potrdite ali prekličite.';
    pasica.classList.remove('skrit');
  } else {
    pasica.classList.add('skrit');
  }
  osveziHud();
}
$('pasicaGumb').addEventListener('click', () => objavi('/okno', {}).catch(pokaziNapako));

function uporabiAktivne(spremembe) {
  Object.assign(stanje.aktivni, spremembe);
  for (const ime of Object.keys(spremembe)) for (const g of (gumbiPoImenu.get(ime) || [])) posodobiGumb(g, ime);
}

async function naloziUkaze() {
  const r = await fetch('/ukazi', { cache: 'no-store' });
  stanje.ukazi = await r.json();
  for (const o of stanje.ukazi.delovnaOkolja) for (const t of o.orodneVrstice) for (const s of t.skupine) for (const u of s) if (!(u.ime in stanje.aktivni)) stanje.aktivni[u.ime] = u.aktiven;
  for (const u of stanje.ukazi.hitriDostop) if (!(u.ime in stanje.aktivni)) stanje.aktivni[u.ime] = u.aktiven;
  narisiZavihke();
  const prvi = stanje.okolje.delovnaMiza && stanje.ukazi.delovnaOkolja.some(o => o.ime === stanje.okolje.delovnaMiza)
    ? stanje.okolje.delovnaMiza : (stanje.ukazi.delovnaOkolja[0] || {}).ime;
  if (prvi) izberiZavihek(prvi, false);
  uporabiOkolje(stanje.okolje);
}

// --- 3D pogled --------------------------------------------------------------
const pogled = $('pogled');
const renderer = new THREE.WebGPURenderer({ antialias: true });
await renderer.init();
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(Math.max(1, pogled.clientWidth), Math.max(1, pogled.clientHeight));
pogled.insertBefore(renderer.domElement, pogled.firstChild);
const izris = renderer.backend && renderer.backend.isWebGPUBackend ? 'WebGPU' : 'WebGL 2';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xeef0f3);
const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 10000);
camera.up.set(0, 0, 1);
camera.position.set(120, -140, 100);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.12;

scene.add(new THREE.HemisphereLight(0xffffff, 0x8a9099, 0.9));
const luc = new THREE.DirectionalLight(0xffffff, 1.6); luc.position.set(1, -1.2, 2.2); scene.add(luc);
const luc2 = new THREE.DirectionalLight(0xffffff, 0.5); luc2.position.set(-1.5, 1, 0.6); scene.add(luc2);
const mreza = new THREE.GridHelper(200, 20, 0xb0b6be, 0xd6dae0); mreza.rotation.x = Math.PI / 2; scene.add(mreza);
scene.add(new THREE.AxesHelper(20));

const materialPloskev = new THREE.MeshStandardMaterial({ vertexColors: true, metalness: 0.05, roughness: 0.55, side: THREE.DoubleSide });
const materialRobov = new THREE.LineBasicMaterial({ vertexColors: true });

let koren = new THREE.Group(); scene.add(koren);
let objekti = new Map();
let prviNalozen = false;

function zgradiObjekt(o) {
  const skupina = new THREE.Group(); skupina.name = o.ime;
  let mesh = null;
  if (o.trikotniki.length) {
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(o.tocke, 3));
    geo.setIndex(o.trikotniki);
    const barve = new Float32Array(o.tocke.length);
    for (const p of o.ploskve) for (let v = p[0]; v < p[0] + p[1]; v++) { barve[3 * v] = p[4]; barve[3 * v + 1] = p[5]; barve[3 * v + 2] = p[6]; }
    geo.setAttribute('color', new THREE.BufferAttribute(barve, 3));
    geo.computeVertexNormals();
    mesh = new THREE.Mesh(geo, materialPloskev);
    mesh.userData = { objekt: o.ime, ploskve: o.ploskve, osnovneBarve: barve.slice() };
    skupina.add(mesh);
  }
  let crte = null;
  if (o.robTocke.length) {
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(o.robTocke, 3));
    const barve = new Float32Array(o.robTocke.length);
    for (let i = 0; i < barve.length; i += 3) { barve[i] = BARVA_ROBA.r; barve[i + 1] = BARVA_ROBA.g; barve[i + 2] = BARVA_ROBA.b; }
    geo.setAttribute('color', new THREE.BufferAttribute(barve, 3));
    crte = new THREE.LineSegments(geo, materialRobov);
    crte.userData = { objekt: o.ime, robovi: o.robovi };
    skupina.add(crte);
  }
  return { skupina, mesh, crte, podatki: o };
}

function pocisti() {
  koren.traverse(n => { if (n.geometry) n.geometry.dispose(); });
  scene.remove(koren);
  koren = new THREE.Group(); scene.add(koren);
  objekti = new Map();
}

async function naloziModel() {
  const odziv = await fetch('/model', { cache: 'no-store' });
  const model = await odziv.json();
  pocisti();
  for (const o of model.objekti) { const z = zgradiObjekt(o); koren.add(z.skupina); objekti.set(o.ime, z); }
  stanje.dokument = model.dokument; stanje.verzija = model.verzija;
  if (!prviNalozen && model.objekti.length) { prilagodiPogled(); prviNalozen = true; }
  oznaciIzbiro(stanje.izbira);
  osveziHud();
}

function prilagodiPogled() {
  const okvir = new THREE.Box3().setFromObject(koren);
  if (okvir.isEmpty()) return;
  const sredisce = okvir.getCenter(new THREE.Vector3());
  const polmer = okvir.getSize(new THREE.Vector3()).length() / 2 || 10;
  const smer = new THREE.Vector3(1, -1.2, 0.9).normalize();
  const razdalja = polmer / Math.sin(THREE.MathUtils.degToRad(camera.fov / 2)) * 1.1;
  camera.position.copy(sredisce).addScaledVector(smer, razdalja);
  camera.near = razdalja / 100; camera.far = razdalja * 100; camera.updateProjectionMatrix();
  controls.target.copy(sredisce); controls.update();
  const velikostMreze = Math.ceil(polmer * 4 / 10) * 10;
  mreza.scale.setScalar(velikostMreze / 200);
  mreza.position.set(sredisce.x, sredisce.y, okvir.min.z);
}

function ploskevTrikotnika(mesh, i) { const p = mesh.userData.ploskve; for (let k = 0; k < p.length; k++) if (i >= p[k][2] && i < p[k][2] + p[k][3]) return k; return -1; }
function robOdseka(crte, i) { const r = crte.userData.robovi; for (let k = 0; k < r.length; k++) if (i >= r[k][0] && i < r[k][0] + r[k][1]) return k; return -1; }
function pobarvajTocke(predmet, zacetek, stevilo, barva) {
  const a = predmet.geometry.attributes.color.array;
  for (let v = zacetek; v < zacetek + stevilo; v++) { a[3 * v] = barva.r; a[3 * v + 1] = barva.g; a[3 * v + 2] = barva.b; }
  predmet.geometry.attributes.color.needsUpdate = true;
}
function oznaciIzbiro(izbira) {
  stanje.izbira = izbira || [];
  for (const z of objekti.values()) {
    if (z.mesh) { z.mesh.geometry.attributes.color.array.set(z.mesh.userData.osnovneBarve); z.mesh.geometry.attributes.color.needsUpdate = true; }
    if (z.crte) { const a = z.crte.geometry.attributes.color.array; for (let i = 0; i < a.length; i += 3) { a[i] = BARVA_ROBA.r; a[i + 1] = BARVA_ROBA.g; a[i + 2] = BARVA_ROBA.b; } z.crte.geometry.attributes.color.needsUpdate = true; }
  }
  for (const s of stanje.izbira) {
    const z = objekti.get(s.objekt); if (!z) continue;
    const elementi = s.elementi && s.elementi.length ? s.elementi : [''];
    for (const el of elementi) {
      if (el.startsWith('Face') && z.mesh) { const p = z.mesh.userData.ploskve[parseInt(el.slice(4), 10) - 1]; if (p) pobarvajTocke(z.mesh, p[0], p[1], BARVA_IZBIRE); }
      else if (el.startsWith('Edge') && z.crte) { const r = z.crte.userData.robovi[parseInt(el.slice(4), 10) - 1]; if (r) pobarvajTocke(z.crte, r[0] * 2, r[1] * 2, BARVA_IZBIRE_ROBA); }
      else if (el === '' && z.mesh) pobarvajTocke(z.mesh, 0, z.mesh.geometry.attributes.position.count, BARVA_IZBIRE);
    }
  }
  osveziHud();
}

const raycaster = new THREE.Raycaster();
const kazalec = new THREE.Vector2();
let pritisk = null;
renderer.domElement.addEventListener('pointerdown', e => { pritisk = { x: e.clientX, y: e.clientY, gumb: e.button }; });
renderer.domElement.addEventListener('pointerup', e => {
  if (!pritisk || pritisk.gumb !== 0) return;
  const premik = Math.hypot(e.clientX - pritisk.x, e.clientY - pritisk.y); pritisk = null;
  if (premik > 4) return;
  const r = renderer.domElement.getBoundingClientRect();
  kazalec.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  raycaster.setFromCamera(kazalec, camera);
  raycaster.params.Line.threshold = controls.getDistance() * 0.004;
  const meshi = [], crte = [];
  for (const z of objekti.values()) { if (z.mesh) meshi.push(z.mesh); if (z.crte) crte.push(z.crte); }
  const zr = raycaster.intersectObjects(crte, false), zp = raycaster.intersectObjects(meshi, false);
  let objekt = null, element = '';
  if (zr.length && (!zp.length || zr[0].distance <= zp[0].distance + raycaster.params.Line.threshold * 2)) { objekt = zr[0].object.userData.objekt; element = 'Edge' + (robOdseka(zr[0].object, Math.floor(zr[0].index / 2)) + 1); }
  else if (zp.length) { objekt = zp[0].object.userData.objekt; element = 'Face' + (ploskevTrikotnika(zp[0].object, zp[0].faceIndex) + 1); }
  if (objekt) objavi('/select', { objekt, element, dodaj: e.ctrlKey }).catch(pokaziNapako);
  else if (!e.ctrlKey) objavi('/select', { objekt: '', element: '', dodaj: false }).catch(pokaziNapako);
});
window.addEventListener('keydown', e => { if ((e.key === 'f' || e.key === 'F') && e.target === document.body) prilagodiPogled(); });

// --- HUD in dogodki ---------------------------------------------------------
function osveziHud() {
  const izbrano = stanje.izbira.length
    ? stanje.izbira.map(s => { const z = objekti.get(s.objekt); const ime = z ? z.podatki.oznaka : s.objekt; return s.elementi.length ? s.elementi.map(el => ime + '.' + el).join(', ') : ime; }).join('; ')
    : 'nič';
  const urejanje = stanje.okolje.urejanje ? ' · urejanje: ' + stanje.okolje.urejanje.split('::').pop() : '';
  const povezava = stanje.povezava === false
    ? ' · <b style="color:#b00">povezava s FreeCAD-om prekinjena, poskušam znova …</b>' : '';
  hud.innerHTML = 'Dokument: <b>' + (stanje.dokument || '–') + '</b> · objektov: ' + objekti.size + ' · posnetek ' + stanje.verzija + urejanje + '<br>'
    + 'Izbira: <b>' + izbrano + '</b> · izris: ' + izris + ' · three.js ' + THREE.REVISION + povezava;
}

const dogodki = new EventSource('/events');
dogodki.addEventListener('model', () => { naloziModel().catch(pokaziNapako); });
dogodki.addEventListener('izbira', e => { oznaciIzbiro(JSON.parse(e.data)); });
dogodki.addEventListener('aktivni', e => { uporabiAktivne(JSON.parse(e.data)); });
dogodki.addEventListener('okolje', e => { uporabiOkolje(JSON.parse(e.data)); });
dogodki.onopen = () => { stanje.povezava = true; osveziHud(); };
dogodki.onerror = () => { stanje.povezava = false; osveziHud(); };

new ResizeObserver(() => {
  const w = pogled.clientWidth, h = pogled.clientHeight;
  if (w < 1 || h < 1) return;
  camera.aspect = w / h; camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}).observe(pogled);
renderer.setAnimationLoop(() => {
  controls.update();
  if (renderer.domElement.clientWidth > 0 && renderer.domElement.clientHeight > 0) renderer.render(scene, camera);
});
naloziUkaze().catch(pokaziNapako);
naloziModel().catch(pokaziNapako);
</script>
